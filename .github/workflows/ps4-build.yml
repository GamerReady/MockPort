name: PS4 build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OO_VERSION: v0.5.4

jobs:
  package:
    runs-on: ubuntu-24.04
    env:
      DOTNET_ROLL_FORWARD: Major
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 nlohmann-json3-dev

      # PkgTool.Core bundles an old .NET runtime that needs OpenSSL 1.x, which
      # Ubuntu 24.04 no longer ships. Take libssl1.1 from the focal archive.
      - name: Install libssl1.1 for PkgTool.Core
        run: |
          echo "deb http://security.ubuntu.com/ubuntu focal-security main" \
            | sudo tee /etc/apt/sources.list.d/focal-security.list
          sudo apt-get update
          sudo apt-get install -y libssl1.1
          sudo rm /etc/apt/sources.list.d/focal-security.list

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache OpenOrbis toolchain
        id: oo-cache
        uses: actions/cache@v4
        with:
          path: openorbis
          key: openorbis-${{ env.OO_VERSION }}

      - name: Download OpenOrbis toolchain
        if: steps.oo-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p openorbis
          gh release download "${OO_VERSION}" -R OpenOrbis/OpenOrbis-PS4-Toolchain \
            --pattern '*.tar.gz' -D openorbis
          tar -xzf openorbis/*.tar.gz -C openorbis

      - name: Locate toolchain
        run: |
          link_x="$(find openorbis -name link.x | head -n1)"
          test -n "${link_x}" || { echo "link.x not found in toolchain"; exit 1; }
          root="$(cd "$(dirname "${link_x}")" && pwd)"
          chmod +x "${root}"/bin/linux/* || true
          echo "OO_PS4_TOOLCHAIN=${root}" >> "$GITHUB_ENV"

      - name: Build MockPort .pkg
        run: bash ps4/tools/build_pkg.sh

      - name: Upload MockPort pkg
        uses: actions/upload-artifact@v4
        with:
          name: MockPort-pkg
          path: ps4/build/pkg/*.pkg

      # Launch bisection. The unmodified OpenOrbis hello_world launches on the
      # console, every MockPort build reports "corrupted data". Swap one side:
      #   G: the sample's own Makefile, but with MockPort's minimal main.cpp
      #   H: MockPort's build script, but with the sample's own main.cpp
      # G must run before the control build, which leaves build output in the
      # toolchain's sample directory.
      - name: Variant G (sample Makefile + MockPort main)
        continue-on-error: true
        run: |
          rm -rf /tmp/hello_world
          cp -r "${OO_PS4_TOOLCHAIN}/samples/hello_world" /tmp/hello_world
          cp ps4/app/main_min.cpp /tmp/hello_world/hello_world/main.cpp
          cd /tmp/hello_world
          make TITLE="MockPort G" TITLE_ID=BREW00085 \
            CONTENT_ID=IV0000-BREW00085_00-HELLOWORLD000000
          mkdir -p "${GITHUB_WORKSPACE}/variant-g"
          cp ./*.pkg "${GITHUB_WORKSPACE}/variant-g/"

      - name: Variant H (MockPort script + sample main)
        continue-on-error: true
        run: |
          OUT="${GITHUB_WORKSPACE}/ps4/build-h" \
          APP_SRC="${OO_PS4_TOOLCHAIN}/samples/hello_world/hello_world/main.cpp" \
          COMPILE_FLAGS="" \
          TITLE="MockPort H" TITLE_ID=MOCK00007 \
          CONTENT_ID=IV0000-MOCK00007_00-MOCKPORT00000000 \
          bash ps4/tools/build_pkg.sh

      - name: Upload variant G pkg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MockPort-G-pkg
          path: variant-g/*.pkg
          if-no-files-found: ignore

      - name: Upload variant H pkg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MockPort-H-pkg
          path: ps4/build-h/pkg/*.pkg
          if-no-files-found: ignore

      # Control: the unmodified OpenOrbis hello_world sample.
      - name: Build OpenOrbis hello_world sample (control)
        continue-on-error: true
        run: |
          cd "${OO_PS4_TOOLCHAIN}/samples/hello_world"
          make
          mkdir -p "${GITHUB_WORKSPACE}/control"
          cp ./*.pkg "${GITHUB_WORKSPACE}/control/"

      - name: Upload control pkg
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Control-hello-world-pkg
          path: control/*.pkg
          if-no-files-found: ignore

      # Informational: never fails the job; the report goes to the job summary.
      - name: Probe Mocktail PS4 sources
        continue-on-error: true
        run: bash ps4/tools/probe_port_sources.sh
